<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OTP Entry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1 id="verification_heading">Verify Your Account</h1>
    <p id="verification_subtext">Enter the 6 digit code sent to your registered mobile number.</p>

    <div class="code-container" id="otp">
      <input class="code" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="digit 1" />
      <input class="code" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="digit 2" />
      <input class="code" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="digit 3" />
      <input class="code" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="digit 4" />
      <input class="code" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="digit 5" />
      <input class="code" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="digit 6" />
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
